name: Leo Skills CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # 每天凌晨2点运行，检查技能状态
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11, 3.12, 3.13]
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install -e .
    
    - name: Lint with flake8
      run: |
        # 停止构建如果有Python语法错误或未定义的名称
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # 将零退出代码视为警告
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run tests with pytest
      run: |
        pytest tests/ -v --tb=short --cov=leo_subagents --cov=tests --cov-report=xml --cov-report=html
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  skill-discovery:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt

    - name: Test skill discovery system
      run: |
        python scripts/manage_skills.py update
        python scripts/manage_skills.py status
    
    - name: Generate Claude skills directory
      run: |
        python scripts/manage_skills.py install
    
    - name: Sync documentation
      run: |
        python scripts/sync_documentation.py
    
    - name: Upload skill registry
      uses: actions/upload-artifact@v4
      with:
        name: skill-registry
        path: .claude/skill_registry.json
        retention-days: 30

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Run security scan with safety
      run: safety check -r requirements.txt || true
    
    - name: Run security scan with bandit
      run: |
        bandit -r leo_subagents/ scripts/ -f json -o bandit-report.json || true
        bandit -r leo_subagents/ scripts/ -f txt
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
        retention-days: 30

  performance-test:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install pytest-benchmark
    
    - name: Run performance tests
      run: |
        pytest tests/test_skill_discovery_comprehensive.py::TestSkillDiscoverySystem::test_discover_skills --benchmark-only --benchmark-json=benchmark.json
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: |
          benchmark.json
        retention-days: 30

  build-docs:
    runs-on: ubuntu-latest
    needs: skill-discovery
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs mkdocs-material
    
    - name: Sync documentation
      run: |
        python scripts/sync_documentation.py
    
    - name: Build documentation
      run: |
        mkdocs build --strict || echo "MkDocs build completed"
    
    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: |
          README.md
          SKILLS_MANIFEST.md
          leo_knowledge/
        retention-days: 30

  notify:
    runs-on: ubuntu-latest
    needs: [test, skill-discovery, security-scan]
    if: always()
    
    steps:
    - name: Notify success
      if: needs.test.result == 'success' && needs.skill-discovery.result == 'success'
      run: |
        echo "✅ All checks passed successfully!"
        if [ -f ".claude/skill_registry.json" ]; then
          echo "📊 Skills found: $(python -c 'import json; print(len(json.load(open(".claude/skill_registry.json")).get("skills", {})))')"
        else
          echo "📊 Skill registry not found, skipping skill count"
        fi
    
    - name: Notify failure
      if: needs.test.result == 'failure' || needs.skill-discovery.result == 'failure'
      run: |
        echo "❌ Some checks failed!"
        exit 1