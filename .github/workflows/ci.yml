# Leo AI System CI/CD
# 简化版配置 - 符合务实优先原则

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: 测试与检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 结构校验
        run: python scripts/development/validate_structure.py

      - name: 命名校验
        run: python scripts/development/validate_naming.py

      - name: 敏感文件检查
        run: |
          if git diff --cached --name-only | grep -E '\.(env|db|sqlite)$'; then
            echo "错误：检测到敏感文件"
            exit 1
          fi

      - name: 代码格式检查
        run: |
          black --check . || echo "⚠️ 代码格式需要调整"
          isort --check-only . || echo "⚠️ 导入排序需要调整"
        continue-on-error: true

      - name: 运行测试
        run: pytest tests/ -v --tb=short

      - name: 测试摘要
        if: always()
        run: echo "✅ CI 流程完成"

