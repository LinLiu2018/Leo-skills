repos:
  # 基础检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  # Python 代码格式化
  - repo: https://github.com/psf/black
    rev: 24.1.0
    hooks:
      - id: black
        language_version: python3
        args: ["--line-length=100"]

  # 导入排序
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=100"]

  # 代码规范检查
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ["--max-line-length=100", "--extend-ignore=E501,W503"]

  # 安全检查
  - repo: https://github.com/pycqa/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-r, leo_subagents/, scripts/, -f, json, -o, bandit-report.json]
        pass_filenames: false

  # 删除未使用的imports
  - repo: https://github.com/pycqa/autoflake
    rev: v2.2.1
    hooks:
      - id: autoflake
        args:
          - --in-place
          - --remove-all-unused-imports
          - --remove-unused-variables
          - --remove-duplicate-keys
          - --ignore-init-module-imports

  # 文档格式检查
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        args: [--fix]

  # 自定义钩子：运行技能发现系统
  - repo: local
    hooks:
      - id: leo-structure-validation
        name: Leo Structure Validation
        entry: python scripts/validate_structure.py
        language: system
        pass_filenames: false
        always_run: true

      - id: leo-skill-check
        name: Leo Skill Validation
        entry: python scripts/manage_skills.py update
        language: system
        pass_filenames: false
        always_run: true

      - id: leo-test
        name: Leo Tests
        entry: pytest tests/test_system_basics.py -v
        language: system
        pass_filenames: false
        always_run: false

      - id: leo-docs-sync
        name: Leo Documentation Sync
        entry: python scripts/sync_documentation.py
        language: system
        pass_filenames: false
        always_run: false

# 全局配置
default_stages: [commit]
fail_fast: false
