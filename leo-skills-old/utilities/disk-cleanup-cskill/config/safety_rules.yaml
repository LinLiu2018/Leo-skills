# 安全规则配置文件
# Safety Rules Configuration

# 白名单（明确允许删除的路径）
whitelist:
  - "C:\\Windows\\Temp"
  - "C:\\Windows\\Prefetch"
  - "C:\\Users\\*\\AppData\\Local\\Temp"
  - "C:\\Users\\*\\AppData\\Local\\Microsoft\\Windows\\Temporary Internet Files"
  - "C:\\Users\\*\\AppData\\Local\\Microsoft\\Windows\\INetCache"
  - "C:\\Windows\\SoftwareDistribution\\Download"

# 黑名单（绝对不能删除的路径）
blacklist:
  # 系统关键目录
  - "C:\\Windows\\System32"
  - "C:\\Windows\\SysWOW64"
  - "C:\\Windows\\WinSxS"
  - "C:\\Windows\\Boot"
  - "C:\\Windows\\Fonts"

  # 程序文件目录
  - "C:\\Program Files"
  - "C:\\Program Files (x86)"
  - "C:\\ProgramData\\Microsoft"

  # 用户重要目录
  - "C:\\Users\\*\\Documents"
  - "C:\\Users\\*\\Desktop"
  - "C:\\Users\\*\\Downloads"
  - "C:\\Users\\*\\Pictures"
  - "C:\\Users\\*\\Videos"
  - "C:\\Users\\*\\Music"
  - "C:\\Users\\*\\OneDrive"

  # 系统配置
  - "C:\\Users\\*\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu"
  - "C:\\Users\\*\\AppData\\Local\\Microsoft\\Windows\\Explorer"

  # 开发环境（保护用户的开发文件）
  - "C:\\Users\\*\\.ssh"
  - "C:\\Users\\*\\.aws"
  - "C:\\Users\\*\\.docker"
  - "C:\\Users\\*\\.kube"

# 受保护的文件类型
protected_file_types:
  system_files:
    - ".sys"
    - ".dll"
    - ".drv"
    - ".ocx"
    - ".cpl"
    - ".scr"

  executables:
    - ".exe"
    - ".com"
    - ".bat"
    - ".cmd"
    - ".ps1"
    - ".vbs"
    - ".js"
    - ".wsf"

  configuration:
    - ".ini"
    - ".cfg"
    - ".conf"
    - ".reg"

  user_data:
    - ".doc"
    - ".docx"
    - ".xls"
    - ".xlsx"
    - ".ppt"
    - ".pptx"
    - ".pdf"
    - ".txt"
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".mp4"
    - ".mp3"
    - ".zip"
    - ".rar"

# 安全检查规则
safety_rules:
  # 文件大小限制（防止误删大文件）
  max_single_file_size_mb: 1024  # 单个文件超过1GB需要额外确认

  # 批量删除限制
  max_files_per_batch: 10000  # 单次最多删除10000个文件
  max_total_size_gb: 50  # 单次最多删除50GB

  # 时间限制
  min_file_age_days: 7  # 只删除7天以前的文件

  # 路径深度限制
  max_path_depth: 10  # 最大路径深度

  # 特殊保护
  protect_recently_accessed: true  # 保护最近访问的文件
  recent_access_days: 7  # 最近7天访问过的文件不删除

  protect_system_restore: true  # 保护系统还原点
  protect_recycle_bin_metadata: true  # 保护回收站元数据

# 确认级别
confirmation_levels:
  low:
    description: "低风险操作，无需确认"
    operations:
      - "analyze_space"
      - "scan_large_files"
      - "find_duplicates"

  medium:
    description: "中等风险操作，需要确认"
    operations:
      - "clean_temp"
      - "clean_browser_cache"

  high:
    description: "高风险操作，需要明确确认"
    operations:
      - "clean_recycle_bin"
      - "clean_logs"
      - "delete_large_files"

# 回滚设置
rollback:
  enable: true
  keep_backup_days: 7
  backup_location: "outputs/backups"
  max_backup_size_gb: 10
