[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-ai-system"
version = "2.0.0"
description = "Leo AI Agent System - Skills + Subagents 协同工作架构"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Leo Liu", email = "linliu2018@example.com"}
]
requires-python = ">=3.9,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["ai", "agent", "skills", "automation", "orchestrator", "mcp", "openclaw"]

# 核心依赖
dependencies = [
    # 基础
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.0",

    # 数据处理
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",

    # 异步
    "aiohttp>=3.9.0",
    "asyncio-throttle>=1.0.2",

    # 网页解析
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",

    # MCP Server
    "mcp>=1.0.0",

    # 数据验证
    "pydantic-settings>=2.0.0",

    # 缓存
    "diskcache>=5.6.0",

    # 日志
    "structlog>=23.0.0",

    # 飞书集成
    "httpx>=0.24.0",
]

# 开发依赖
[project.optional-dependencies]
dev = [
    # 测试
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.11.0",
    "pytest-timeout>=2.1.0",

    # 代码质量
    "black>=23.0",
    "isort>=5.12",
    "ruff>=0.1.0",
    "mypy>=1.4.0",

    # 类型检查
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0",
    "types-beautifulsoup4>=4.12.0",

    # 安全审计
    "pip-audit>=1.0.0",
    "safety>=2.3.0",
]

# Web 界面依赖
web = [
    "streamlit>=1.28",
    "gradio>=4.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.25.0",
]

# 文档依赖
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings>=0.23.0",
]

# 向量检索依赖
vector = [
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
]

# 完整依赖
all = [
    "leo-ai-system[dev]",
    "leo-ai-system[web]",
]

[project.scripts]
leo = "leo_system.cli:main"

[project.urls]
Homepage = "https://github.com/LinLiu2018/Leo-skills"
Repository = "https://github.com/LinLiu2018/Leo-skills"
Documentation = "https://github.com/LinLiu2018/Leo-skills/blob/main/LEO_SYSTEM_README.md"

# 包配置
[tool.setuptools.packages.find]
where = ["src"]
include = [
    "leo_orchestrator*",
    "leo_subagents*",
    "leo_skills*",
    "leo_system*",
    "leo_interface*",
    "leo_config*",
    "leo_knowledge*",
    "leo_workflows*",
    "leo_memory*",
    "leo_gateway*",
    "leo_core*",
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.md", "*.json", "*.txt"]

# pytest 配置
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "auto"

# black 配置
[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

# isort 配置
[tool.isort]
profile = "black"
line_length = 100
known_first_party = [
    "leo_orchestrator",
    "leo_subagents",
    "leo_skills",
    "leo_system",
    "leo_memory",
    "leo_workflows",
    "leo_interface",
    "leo_config",
    "leo_gateway",
    "leo_core",
]
skip_gitignore = true

# ruff 配置 (更快)
[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]

# mypy 配置
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiohttp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "wechatpy.*"
ignore_missing_imports = true

# coverage 配置
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
precision = 2

[tool.coverage.html]
directory = "htmlcov"
