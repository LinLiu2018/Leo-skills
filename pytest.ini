[tool:pytest]
minversion = 6.0
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=leo_skills
    --cov=leo_subagents
    --cov=leo_orchestrator
    --cov=leo_workflows
    --cov=leo_system
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=80
    --html=htmlcov/report.html
    --self-contained-html
testpaths = tests

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests that take time to run
    workflow: Workflow tests
    agent: Agent tests
    skill: Skill tests

asyncio_mode = auto

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning