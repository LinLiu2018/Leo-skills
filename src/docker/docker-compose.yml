version: '3.8'

services:
  openclaw-gateway:
    image: openclaw/openclaw:latest
    container_name: openclaw-gateway
    ports:
      - "18789:18789"  # Gateway
      - "18788:18788"  # Control UI
      - "18790:18790"  # WebChat
    volumes:
      - ~/.openclaw:/root/.openclaw
      - ./config:/app/config
    environment:
      - NODE_ENV=production
      - OPENCLAW_PORT=18789
    restart: unless-stopped
    networks:
      - openclaw-network

  openclaw-browser:
    image: mcr.microsoft.com/playwright:v1.40.0
    container_name: openclaw-browser
    ports:
      - "9222:9222"  # DevTools
    environment:
      - PWDEBUG=0
    restart: unless-stopped
    networks:
      - openclaw-network

networks:
  openclaw-network:
    driver: bridge

volumes:
  openclaw-data:
