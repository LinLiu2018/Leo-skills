# 监控配置
monitoring:
  # 每次采集的最大推文数
  max_tweets_per_user: 100

  # 回溯天数
  lookback_days: 7

  # 是否包含转发
  include_retweets: false

  # 是否包含回复
  include_replies: false

  # 最小点赞数（过滤低质量内容）
  min_likes: 5

  # 最小转发数
  min_retweets: 2
