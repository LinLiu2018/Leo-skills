# Twitter Monitor Skill - 主配置文件
# =====================================================

# Skill 元信息
skill:
  name: "twitter-monitor-cskill"
  version: "1.0.0"
  description: "监控 Twitter 上的 AI 科技博主，采集最新推文"
  author: "Leo Liu"
  created: "2026-01-23"

# Twitter API 配置
twitter:
  # 从环境变量读取（不要在此文件中硬编码密钥！）
  bearer_token: "${TWITTER_BEARER_TOKEN}"
  api_key: "${TWITTER_API_KEY}"
  api_secret: "${TWITTER_API_SECRET}"
  access_token: "${TWITTER_ACCESS_TOKEN}"
  access_token_secret: "${TWITTER_ACCESS_TOKEN_SECRET}"

# 监控配置
monitoring:
  # 采集频率（Cron 表达式）
  schedule: "0 8,20 * * *"  # 每天 8:00 和 20:00

  # 时区
  timezone: "Asia/Shanghai"

  # 每次采集的推文数量
  max_tweets_per_user: 100

  # 时间范围（天）
  lookback_days: 7

  # 是否包含转发
  include_retweets: false

  # 是否包含回复
  include_replies: false

  # 质量过滤
  filters:
    min_likes: 5
    min_retweets: 2
    min_length: 50  # 最小字符数

# 速率限制配置
rate_limiting:
  # 请求间隔（秒）
  request_interval: 2

  # 添加随机延迟（秒）
  random_delay: 0.5

  # 每小时最大请求数
  max_requests_per_hour: 300

  # 达到限制后的等待时间（秒）
  cooldown_period: 900  # 15 分钟

# 去重配置
deduplication:
  # 相似度阈值（0-1）
  similarity_threshold: 0.85

  # 是否启用内容哈希去重
  enable_hash_dedup: true

  # 是否启用 URL 去重
  enable_url_dedup: true

  # 是否启用相似度去重
  enable_similarity_dedup: true

# 数据库配置
database:
  # 数据库路径
  path: "data/twitter_monitor.db"

  # 是否自动创建表
  auto_create_tables: true

  # 数据保留天数（0 表示永久保留）
  retention_days: 90

# 日志配置
logging:
  # 日志级别：DEBUG, INFO, WARNING, ERROR
  level: "INFO"

  # 日志文件路径
  file: "logs/twitter_monitor.log"

  # 日志格式
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # 是否输出到控制台
  console: true

# HTTP 客户端配置
http_client:
  # 超时时间（秒）
  timeout: 30

  # 最大重试次数
  max_retries: 3

  # 重试延迟（秒）
  retry_delay: 5

  # User-Agent
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

# 进化配置
evolution:
  # 是否启用自我进化
  enabled: true

  # 学习配置
  learning:
    # 触发学习的最小执行次数
    min_executions_for_learning: 10

    # 分析窗口大小
    analysis_window: 100

  # 优化配置
  optimization:
    # 是否自动优化
    auto_optimize: false

    # 是否需要人工审批
    require_approval: true
