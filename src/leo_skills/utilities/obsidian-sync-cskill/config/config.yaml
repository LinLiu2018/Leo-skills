# Obsidian Sync Skill 配置文件

# Obsidian Vault 路径（使用正斜杠）
vault_path: "d:/桌面/Leo-Outputs"

# 默认文件夹
default_folder: "00-Inbox"
daily_folder: "01-Daily"
leo_output_folder: "Leo-Outputs"
moc_folder: "05-MOC"

# 模板文件夹
template_folder: "Templates"

# 自动创建文件夹
auto_create_folders: true

# 自动添加元数据
auto_add_metadata: true

# 默认标签
default_tags:
  - claude生成

# Leo Skill 输出文件夹映射
skill_folders:
  twitter-monitor-cskill: twitter
  tech-extractor-cskill: tech-intelligence
  content-layout-leo-cskill: content-layout
  research-assistant-cskill: research

# 日期格式
daily_format: "%Y-%m-%d"
