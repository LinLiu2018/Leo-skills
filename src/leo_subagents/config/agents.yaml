# Leo Subagents配置文件
# 定义所有Subagent的能力和参数

version: "1.0.0"
last_updated: "2026-01-08"

# 全局配置
global:
  default_timeout: 300 # 默认超时时间（秒）
  max_retries: 3 # 最大重试次数
  log_level: INFO # 日志级别
  parallel_execution: true # 是否允许并行执行

# Subagents定义
agents:
  # 任务执行代理
  task_agent:
    name: "Task Agent"
    description: "执行具体任务，调用相关Skills"
    type: "executor"
    priority: 1

    # 可调用的Skills
    skills:
      - name: "content_layout_leo_skill"
        path: "../leo_skills/content_creation/content_layout_leo_skill"
        enabled: true
      - name: "realestate_news_publisher_skill"
        path: "../leo_skills/content_creation/realestate_news_publisher_skill"
        enabled: true
      - name: "project_marketing_doc_generator_skill"
        path: "../leo_skills/content_creation/project_marketing_doc_generator_skill"
        enabled: true

    # 执行参数
    config:
      batch_size: 10
      async_execution: true

    # 激活词
    activation_keywords:
      - "执行任务"
      - "运行流程"
      - "开始工作"

  # 研究代理
  research_agent:
    name: "Research Agent"
    description: "信息收集、文献调研、知识整理"
    type: "researcher"
    priority: 2

    skills:
      - name: "research_assistant_skill"
        path: "../leo_skills/utilities/research_assistant_skill"
        enabled: true
      - name: "web_search_skill" # 🆕 添加WebSearch Skill
        path: "../leo_skills/utilities/web_search_skill"
        enabled: true
      - name: "article_to_prototype_skill"
        path: "../leo_skills/tools/article_to_prototype_skill"
        enabled: true

    config:
      max_sources: 20
      research_depth: 3 # 研究深度级别

    activation_keywords:
      - "帮我研究"
      - "调研"
      - "文献查阅"

  # 分析代理
  analysis_agent:
    name: "Analysis Agent"
    description: "数据分析、趋势分析、报告生成、市场研究"
    type: "analyzer"
    priority: 3

    skills:
      - name: "data_analyzer_skill"
        path: "../leo_skills/utilities/data_analyzer_skill"
        enabled: true
      - name: "web_search_skill"
        path: "../leo_skills/utilities/web_search_skill"
        enabled: true
      - name: "research_assistant_skill"
        path: "../leo_skills/utilities/research_assistant_skill"
        enabled: true

    config:
      analysis_method: "statistical"
      visualization: true
      research_depth: 2

    activation_keywords:
      - "分析数据"
      - "生成报告"
      - "趋势分析"
      - "市场研究"
      - "数据统计"

  # 创作代理
  creative_agent:
    name: "Creative Agent"
    description: "内容创作、文案生成、创意输出"
    type: "creator"
    priority: 4

    skills:
      - name: "content_layout_leo_skill"
        path: "../leo_skills/content_creation/content_layout_leo_skill"
        enabled: true
      - name: "article_to_prototype_skill"
        path: "../leo_skills/tools/article_to_prototype_skill"
        enabled: true

    config:
      creativity_level: "balanced" # conservative, balanced, innovative
      output_formats:
        - markdown
        - html
        - plain_text

    activation_keywords:
      - "创作内容"
      - "生成文案"
      - "写文章"

  # 房地产代理
  realestate_agent:
    name: "RealEstate Agent"
    description: "房地产市场分析、项目营销、政策追踪"
    type: "realestate"
    priority: 5

    skills:
      - name: "project_marketing_doc_generator_skill"
        path: "../leo_skills/content_creation/project_marketing_doc_generator_skill"
        enabled: true
      - name: "realestate_news_publisher_skill"
        path: "../leo_skills/content_creation/realestate_news_publisher_skill"
        enabled: true
      - name: "web_search_skill"
        path: "../leo_skills/utilities/web_search_skill"
        enabled: true
      - name: "research_assistant_skill"
        path: "../leo_skills/utilities/research_assistant_skill"
        enabled: true

    config:
      market_focus: "residential" # residential, commercial, mixed
      analysis_depth: 3

    activation_keywords:
      - "房地产"
      - "楼盘"
      - "项目营销"
      - "市场分析"

  # 架构师代理
  architect_agent:
    name: "Architect Agent"
    description: "技术选型、系统设计和数据库设计"
    type: "architect"
    priority: 2

    skills:
      - name: "database_model_generator_skill"
        path: "../leo_skills/backend/database_model_generator_skill"
        enabled: true
      - name: "api_doc_generator_skill"
        path: "../leo_skills/backend/api_doc_generator_skill"
        enabled: true
      - name: "research_assistant_skill"
        path: "../leo_skills/utilities/research_assistant_skill"
        enabled: true

    config:
      output_format: "mermaid"
      design_depth: 3

    activation_keywords:
      - "架构设计"
      - "技术选型"
      - "系统设计"
      - "数据库设计"
      - "API设计"

  # 移动开发代理
  mobile_agent:
    name: "Mobile Agent"
    description: "小程序、React Native和Flutter开发"
    type: "mobile"
    priority: 16

    skills:
      - name: "miniprogram_page_generator_skill"
        path: "../leo_skills/frontend/miniprogram_page_generator_skill"
        enabled: true
      - name: "miniprogram_component_generator_skill"
        path: "../leo_skills/frontend/miniprogram_component_generator_skill"
        enabled: true
      - name: "miniprogram_project_scaffold_skill"
        path: "../leo_skills/scaffold/miniprogram_project_scaffold_skill"
        enabled: true

    config:
      default_platform: "miniprogram"
      supported_platforms:
        - miniprogram
        - flutter
        - react_native
        - uniapp

    activation_keywords:
      - "小程序开发"
      - "移动开发"
      - "React Native"
      - "Flutter"
      - "微信小程序"

  # 产品经理代理
  product_manager_agent:
    name: "Product Manager Agent"
    description: "需求分析、PRD编写和用户故事设计"
    type: "product_manager"
    priority: 1

    skills:
      - name: "research_assistant_skill"
        path: "../leo_skills/utilities/research_assistant_skill"
        enabled: true
      - name: "web_search_skill"
        path: "../leo_skills/utilities/web_search_skill"
        enabled: true

    config:
      output_format: "markdown"
      templates:
        - prd
        - user_story
        - competitor_analysis

    activation_keywords:
      - "分析需求"
      - "写PRD"
      - "用户故事"
      - "产品设计"
      - "竞品分析"

  # 电商代理 (新增)
  ecommerce_agent:
    name: "Ecommerce Agent"
    description: "AI眼镜电商、竞品分析和爆款文案"
    type: "ecommerce"
    priority: 6

    skills:
      - name: "research_assistant_skill"
        path: "../leo_skills/utilities/research_assistant_skill"
        enabled: true
      - name: "web_search_skill"
        path: "../leo_skills/utilities/web_search_skill"
        enabled: true
      - name: "content_layout_leo_skill"
        path: "../leo_skills/content_creation/content_layout_leo_skill"
        enabled: true
      - name: "article_to_prototype_skill"
        path: "../leo_skills/tools/article_to_prototype_skill"
        enabled: true

    config:
      market_niche: "smart_glasses"
      copywriting_style: "viral" # viral, professional, storytelling

    activation_keywords:
      - "电商"
      - "AI眼镜"
      - "竞品分析"
      - "爆款文案"
      - "选品"

  # AI新闻摘要代理
  ai_news_summary_agent:
    name: "AI News Summary"
    description: "AI新闻摘要代理，自动收集和生成AI相关新闻摘要"
    type: "researcher"
    priority: 10

    skills:
      - name: "research_assistant_skill"
        path: "../leo_skills/utilities/research_assistant_skill"
        enabled: true
      - name: "web_search_skill"
        path: "../leo_skills/utilities/web_search_skill"
        enabled: true

    config:
      output_format: "json"

    activation_keywords:
      - "ai_news_summary"

# Workflow映射
workflows:
  content_pipeline:
    agents:
      - research_agent
      - creative_agent
      - task_agent
    sequence:
      - step: "research"
        agent: "research_agent"
      - step: "create"
        agent: "creative_agent"
      - step: "publish"
        agent: "task_agent"

  research_pipeline:
    agents:
      - research_agent
      - analysis_agent
    sequence:
      - step: "collect"
        agent: "research_agent"
      - step: "analyze"
        agent: "analysis_agent"

  analysis_pipeline:
    agents:
      - analysis_agent
      - task_agent
    sequence:
      - step: "analyze"
        agent: "analysis_agent"
      - step: "report"
        agent: "task_agent"

# 技能桥接配置
skills_bridge:
  auto_discovery: true # 自动发现Skills
  skill_paths:
    - "../leo_skills/content_creation/*"
    - "../leo_skills/tools/*"
    - "../leo_skills/utilities/*"
    - "../leo_skills/data_analysis/*"
    - "../leo_skills/automation/*"

  load_policy: "lazy" # lazy, eager, on_demand

  # Skill状态检查
  health_check:
    enabled: true
    interval: 3600 # 每小时检查一次
