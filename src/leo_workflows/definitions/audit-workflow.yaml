# 审计工作流
# 自动业务审计和报告

name: audit-workflow
description: 审计自动工作流
version: 1.0.0
category: business

# 触发条件
triggers:
  - type: cron
    expr: "0 5 * * 1"  # 每周一 5 点
  - type: manual
    description: 手动审计

# 输入参数
inputs:
  - name: audit_scope
    type: string
    default: "full"
    options: ["full", "financial", "operational", "compliance"]
    description: 审计范围
  - name: audit_period
    type: string
    default: "last_month"
    description: 审计周期

# 执行步骤
steps:
  - name: collect_audit_data
    description: 收集审计数据
    agent: analysis_agent
    skill: analytics-skill
    action: collect_audit_data
    params:
      scope: "{{inputs.audit_scope}}"
      period: "{{inputs.audit_period}}"
    output: audit_data

  - name: analyze_data
    description: 分析数据
    agent: analysis_agent
    skill: analytics-skill
    action: analyze_audit_data
    params:
      data: "{{steps.collect_audit_data.output}}"
    output: analysis_results

  - name: identify_issues
    description: 识别问题
    agent: analysis_agent
    skill: analytics-skill
    action: identify_audit_issues
    params:
      analysis: "{{steps.analyze_data.output}}"
    output: issues

  - name: generate_findings
    description: 生成发现
    agent: creative_agent
    skill: doc-generator-skill
    action: generate_audit_findings
    params:
      issues: "{{steps.identify_issues.output}}"
    output: findings

  - name: generate_report
    description: 生成报告
    agent: creative_agent
    skill: doc-generator-skill
    action: generate_audit_report
    params:
      findings: "{{steps.generate_findings.output}}"
    output: audit_report

  - name: distribute_report
    description: 分发报告
    agent: distribution_agent
    skill: notification-skill
    action: send_audit_report
    params:
      report: "{{steps.generate_report.output}}"
    output: distribution_result

# 输出
outputs:
  - name: issues_count
    value: "{{steps.identify_issues.output.count}}"
  - name: report_url
    value: "{{steps.generate_report.output.url}}"
  - name: audit_status
    value: "{{steps.generate_report.output.status}}"

# 错误处理
on_error:
  - action: notify
    channel: feishu
    message: "审计工作流执行失败：{{error.message}}"
  - action: retry
    max_retries: 3
    delay: 300
