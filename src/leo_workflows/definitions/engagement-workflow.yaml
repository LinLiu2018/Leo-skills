# 互动管理工作流
# 自动互动和粉丝管理

name: engagement-workflow
description: 互动自动管理工作流
version: 1.0.0
category: content

# 触发条件
triggers:
  - type: event
    event: new_comment  # 新评论
  - type: event
    event: new_message  # 新消息

# 执行步骤
steps:
  - name: fetch_interactions
    description: 获取互动
    agent: distribution_agent
    skill: social-media-skill
    action: get_new_interactions
    output: interactions

  - name: classify_interactions
    description: 分类互动
    agent: analysis_agent
    skill: analytics-skill
    action: classify
    params:
      interactions: "{{steps.fetch_interactions.output}}"
    output: classified

  - name: generate_responses
    description: 生成回复
    agent: creative_agent
    skill: content-generator-skill
    action: generate_responses
    params:
      interactions: "{{steps.fetch_interactions.output}}"
    output: responses

  - name: post_responses
    description: 发布回复
    agent: distribution_agent
    skill: social-media-skill
    action: post_responses
    params:
      responses: "{{steps.generate_responses.output}}"
    output: post_results

  - name: track_engagement
    description: 追踪互动
    agent: distribution_agent
    skill: analytics-skill
    action: track_engagement
    params:
      interactions: "{{steps.fetch_interactions.output}}"
    output: engagement_metrics

# 输出
outputs:
  - name: interactions_handled
    value: "{{steps.post_responses.output.count}}"
  - name: response_rate
    value: "{{steps.post_responses.output.response_rate}}"

# 错误处理
on_error:
  - action: notify
    channel: feishu
    message: "互动工作流执行失败：{{error.message}}"
  - action: retry
    max_retries: 3
    delay: 300
