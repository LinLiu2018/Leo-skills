# 房源发布工作流
# 自动发布房源到多个渠道

name: listing-publish-workflow
description: 房源自动发布工作流
version: 1.0.0
category: realestate

# 触发条件
triggers:
  - type: event
    event: new_listing  # 新房源录入
  - type: manual
    description: 手动触发发布

# 输入参数
inputs:
  - name: listing_id
    type: string
    required: true
    description: 房源 ID
  - name: channels
    type: array
    default: ["feishu", "wechat", "website"]
    description: 发布渠道

# 执行步骤
steps:
  - name: fetch_listing_info
    description: 获取房源信息
    agent: realestate_agent
    skill: realestate-listing-skill
    action: get_listing
    params:
      listing_id: "{{inputs.listing_id}}"
    output: listing_info

  - name: generate_description
    description: 生成房源描述
    agent: creative_agent
    skill: content-generator-skill
    action: generate_listing_description
    params:
      listing_info: "{{steps.fetch_listing_info.output}}"
      style: "professional"
    output: description

  - name: generate_images
    description: 生成房源图片
    agent: creative_agent
    skill: image-generator-skill
    action: generate_listing_images
    params:
      listing_info: "{{steps.fetch_listing_info.output}}"
      template: "realestate"
    output: images

  - name: publish_to_channels
    description: 发布到各渠道
    agent: distribution_agent
    skill: social-media-skill
    action: multi_channel_publish
    params:
      content: "{{steps.generate_description.output}}"
      images: "{{steps.generate_images.output}}"
      channels: "{{inputs.channels}}"
    output: publish_results

  - name: update_listing_status
    description: 更新房源状态
    agent: realestate_agent
    skill: realestate-listing-skill
    action: update_status
    params:
      listing_id: "{{inputs.listing_id}}"
      status: "published"
      publish_time: "{{now}}"
    output: update_result

  - name: notify_team
    description: 通知团队
    agent: sales_agent
    skill: notification-skill
    action: send_notification
    params:
      message: "新房源已发布：{{steps.fetch_listing_info.output.title}}"
      channels: ["feishu", "wechat"]
    output: notify_result

# 输出
outputs:
  - name: publish_status
    value: "{{steps.update_listing_status.output.status}}"
  - name: publish_channels
    value: "{{steps.publish_to_channels.output.channels}}"

# 错误处理
on_error:
  - action: notify
    channel: feishu
    message: "房源发布工作流执行失败：{{error.message}}"
  - action: retry
    max_retries: 3
    delay: 300
