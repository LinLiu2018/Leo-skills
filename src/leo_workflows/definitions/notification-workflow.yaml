# 通知管理工作流
# 自动通知和提醒管理

name: notification-workflow
description: 通知自动管理工作流
version: 1.0.0
category: business

# 触发条件
triggers:
  - type: event
    event: notification_required  # 需要通知
  - type: manual
    description: 手动发送

# 输入参数
inputs:
  - name: notification_type
    type: string
    required: true
    description: 通知类型
  - name: recipients
    type: array
    description: 接收者列表
  - name: priority
    type: string
    default: "normal"
    options: ["low", "normal", "high", "urgent"]
    description: 优先级

# 执行步骤
steps:
  - name: generate_message
    description: 生成消息
    agent: creative_agent
    skill: content-generator-skill
    action: generate_notification
    params:
      type: "{{inputs.notification_type}}"
      priority: "{{inputs.priority}}"
    output: message

  - name: select_channels
    description: 选择渠道
    agent: distribution_agent
    skill: notification-skill
    action: select_channels
    params:
      message: "{{steps.generate_message.output}}"
      recipients: "{{inputs.recipients}}"
    output: channels

  - name: send_notifications
    description: 发送通知
    agent: distribution_agent
    skill: notification-skill
    action: send_multi_channel
    params:
      message: "{{steps.generate_message.output}}"
      channels: "{{steps.select_channels.output}}"
    output: send_results

  - name: track_delivery
    description: 追踪送达
    agent: analysis_agent
    skill: analytics-skill
    action: track_delivery
    params:
      send_results: "{{steps.send_notifications.output}}"
    output: delivery_status

# 输出
outputs:
  - name: sent_count
    value: "{{steps.send_notifications.output.sent_count}}"
  - name: delivery_rate
    value: "{{steps.track_delivery.output.delivery_rate}}"

# 错误处理
on_error:
  - action: notify
    channel: feishu
    message: "通知工作流执行失败：{{error.message}}"
  - action: retry
    max_retries: 3
    delay: 300
