# 编排 Agent 工作流
# 多 Agent 任务编排和协调

name: orchestrator-agent-workflow
description: Agent 编排自动工作流
version: 1.0.0
category: collaboration

# 触发条件
triggers:
  - type: event
    event: complex_task  # 复杂任务
  - type: manual
    description: 手动编排

# 输入参数
inputs:
  - name: task_description
    type: string
    required: true
    description: 任务描述
  - name: available_agents
    type: array
    default: ["sales_agent", "support_agent", "analysis_agent", "creative_agent"]
    description: 可用 Agent 列表
  - name: priority
    type: string
    default: "normal"
    options: ["low", "normal", "high", "urgent"]
    description: 优先级

# 执行步骤
steps:
  - name: analyze_task
    description: 分析任务
    agent: analysis_agent
    skill: analytics-skill
    action: analyze_task_requirements
    params:
      task: "{{inputs.task_description}}"
    output: task_analysis

  - name: decompose_task
    description: 分解任务
    agent: analysis_agent
    skill: analytics-skill
    action: decompose_into_subtasks
    params:
      analysis: "{{steps.analyze_task.output}}"
    output: subtasks

  - name: assign_subtasks
    description: 分配子任务
    agent: task_agent
    skill: scheduler-skill
    action: assign_to_agents
    params:
      subtasks: "{{steps.decompose_task.output}}"
      agents: "{{inputs.available_agents}}"
    output: assignments

  - name: coordinate_execution
    description: 协调执行
    agent: task_agent
    skill: scheduler-skill
    action: coordinate_agents
    params:
      assignments: "{{steps.assign_subtasks.output}}"
    output: execution_status

  - name: consolidate_results
    description: 汇总结果
    agent: analysis_agent
    skill: analytics-skill
    action: consolidate_results
    params:
      execution_status: "{{steps.coordinate_execution.output}}"
    output: final_results

  - name: report_completion
    description: 报告完成
    agent: distribution_agent
    skill: notification-skill
    action: notify_task_completion
    params:
      results: "{{steps.consolidate_results.output}}"
    output: notification_result

# 输出
outputs:
  - name: task_status
    value: "{{steps.coordinate_execution.output.status}}"
  - name: final_results
    value: "{{steps.consolidate_results.output}}"

# 错误处理
on_error:
  - action: notify
    channel: feishu
    message: "编排工作流执行失败：{{error.message}}"
  - action: notify
    channel: feishu
    message: "需要人工干预"
