# 房产估值工作流
# 自动评估房产价值

name: property-valuation-workflow
description: 房产自动估值工作流
version: 1.0.0
category: realestate

# 触发条件
triggers:
  - type: event
    event: valuation_request  # 估值请求
  - type: manual
    description: 手动触发估值

# 输入参数
inputs:
  - name: property_id
    type: string
    required: true
    description: 房产 ID
  - name: valuation_type
    type: string
    default: "market"
    options: ["market", "mortgage", "tax"]
    description: 估值类型

# 执行步骤
steps:
  - name: fetch_property_info
    description: 获取房产信息
    agent: realestate_agent
    skill: realestate-listing-skill
    action: get_property
    params:
      property_id: "{{inputs.property_id}}"
    output: property_info

  - name: fetch_comparable_sales
    description: 获取可比成交
    agent: realestate_agent
    skill: market-analysis-skill
    action: get_comparable_sales
    params:
      location: "{{steps.fetch_property_info.output.location}}"
      property_type: "{{steps.fetch_property_info.output.type}}"
      area_range: "±20%"
    output: comparable_sales

  - name: analyze_market_trends
    description: 分析市场趋势
    agent: analysis_agent
    skill: analytics-skill
    action: analyze_trends
    params:
      location: "{{steps.fetch_property_info.output.location}}"
      period: "6months"
    output: market_trends

  - name: calculate_valuation
    description: 计算估值
    agent: realestate_agent
    skill: property-valuation-skill
    action: calculate_value
    params:
      property_info: "{{steps.fetch_property_info.output}}"
      comparable_sales: "{{steps.fetch_comparable_sales.output}}"
      market_trends: "{{steps.analyze_market_trends.output}}"
      valuation_type: "{{inputs.valuation_type}}"
    output: valuation_result

  - name: generate_report
    description: 生成估值报告
    agent: creative_agent
    skill: doc-generator-skill
    action: generate_valuation_report
    params:
      property_info: "{{steps.fetch_property_info.output}}"
      valuation_result: "{{steps.calculate_valuation.output}}"
    output: report

  - name: send_report
    description: 发送报告
    agent: support_agent
    skill: email-skill
    action: send_email
    params:
      to: "{{steps.fetch_property_info.output.owner_email}}"
      subject: "房产估值报告 - {{steps.fetch_property_info.output.address}}"
      attachment: "{{steps.generate_report.output}}"
    output: send_result

# 输出
outputs:
  - name: valuation_value
    value: "{{steps.calculate_valuation.output.value}}"
  - name: valuation_date
    value: "{{steps.calculate_valuation.output.date}}"

# 错误处理
on_error:
  - action: notify
    channel: feishu
    message: "房产估值工作流执行失败：{{error.message}}"
  - action: retry
    max_retries: 3
    delay: 300
