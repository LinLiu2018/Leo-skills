# 销售分析工作流
# 自动销售数据分析

name: sales-analysis-workflow
description: 销售自动分析工作流
version: 1.0.0
category: ecommerce

# 触发条件
triggers:
  - type: cron
    expr: "0 9 * * *"  # 每天 9 点
  - type: manual
    description: 手动分析销售

# 输入参数
inputs:
  - name: period
    type: string
    default: "yesterday"
    options: ["yesterday", "week", "month", "quarter"]
    description: 分析周期

# 执行步骤
steps:
  - name: fetch_sales_data
    description: 获取销售数据
    agent: operation_agent
    skill: shopify-skill
    action: get_sales_data
    params:
      period: "{{inputs.period}}"
    output: sales_data

  - name: calculate_metrics
    description: 计算指标
    agent: analysis_agent
    skill: analytics-skill
    action: calculate_metrics
    params:
      sales_data: "{{steps.fetch_sales_data.output}}"
      metrics: ["revenue", "orders", "aov", "conversion_rate"]
    output: metrics

  - name: compare_with_previous
    description: 对比前期
    agent: analysis_agent
    skill: analytics-skill
    action: compare_period
    params:
      current: "{{steps.calculate_metrics.output}}"
      previous_period: "{{inputs.period}}"
    output: comparison

  - name: identify_trends
    description: 识别趋势
    agent: analysis_agent
    skill: analytics-skill
    action: identify_trends
    params:
      sales_data: "{{steps.fetch_sales_data.output}}"
    output: trends

  - name: generate_insights
    description: 生成洞察
    agent: analysis_agent
    skill: analytics-skill
    action: generate_insights
    params:
      metrics: "{{steps.calculate_metrics.output}}"
      comparison: "{{steps.compare_with_previous.output}}"
      trends: "{{steps.identify_trends.output}}"
    output: insights

  - name: generate_report
    description: 生成报告
    agent: creative_agent
    skill: doc-generator-skill
    action: generate_sales_report
    params:
      period: "{{inputs.period}}"
      insights: "{{steps.generate_insights.output}}"
    output: report

  - name: notify_team
    description: 通知团队
    agent: operation_agent
    skill: notification-skill
    action: send_notification
    params:
      message: "销售报告已生成：{{inputs.period}}"
      report: "{{steps.generate_report.output}}"
    output: notify_result

# 输出
outputs:
  - name: revenue
    value: "{{steps.calculate_metrics.output.revenue}}"
  - name: growth_rate
    value: "{{steps.compare_with_previous.output.growth_rate}}"
  - name: report_url
    value: "{{steps.generate_report.output.url}}"

# 错误处理
on_error:
  - action: notify
    channel: feishu
    message: "销售分析工作流执行失败：{{error.message}}"
  - action: retry
    max_retries: 3
    delay: 300
