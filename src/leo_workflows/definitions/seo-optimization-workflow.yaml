# SEO 优化工作流
# 自动 SEO 优化和排名追踪

name: seo-optimization-workflow
description: SEO 自动优化工作流
version: 1.0.0
category: content

# 触发条件
triggers:
  - type: cron
    expr: "0 15 * * *"  # 每天 15 点
  - type: event
    event: new_content  # 新内容发布

# 输入参数
inputs:
  - name: content_url
    type: string
    description: 内容 URL
  - name: target_keywords
    type: array
    description: 目标关键词

# 执行步骤
steps:
  - name: analyze_content
    description: 分析内容
    agent: distribution_agent
    skill: seo-skill
    action: analyze_content
    params:
      url: "{{inputs.content_url}}"
    output: content_analysis

  - name: keyword_research
    description: 关键词研究
    agent: distribution_agent
    skill: seo-skill
    action: research_keywords
    params:
      topic: "{{steps.analyze_content.output.topic}}"
    output: keyword_data

  - name: optimize_on_page
    description: 页面优化
    agent: distribution_agent
    skill: seo-skill
    action: optimize_on_page
    params:
      content_analysis: "{{steps.analyze_content.output}}"
      keywords: "{{steps.keyword_research.output}}"
    output: on_page_optimization

  - name: check_technical_seo
    description: 技术 SEO 检查
    agent: analysis_agent
    skill: seo-skill
    action: check_technical
    params:
      url: "{{inputs.content_url}}"
    output: technical_seo

  - name: generate_recommendations
    description: 生成建议
    agent: analysis_agent
    skill: analytics-skill
    action: generate_recommendations
    params:
      on_page: "{{steps.optimize_on_page.output}}"
      technical: "{{steps.check_technical_seo.output}}"
    output: recommendations

  - name: implement_changes
    description: 实施修改
    agent: distribution_agent
    skill: seo-skill
    action: implement_seo_changes
    params:
      recommendations: "{{steps.generate_recommendations.output}}"
    output: implementation_result

  - name: track_rankings
    description: 追踪排名
    agent: distribution_agent
    skill: seo-skill
    action: track_rankings
    params:
      url: "{{inputs.content_url}}"
      keywords: "{{inputs.target_keywords}}"
    output: ranking_data

# 输出
outputs:
  - name: seo_score
    value: "{{steps.optimize_on_page.output.score}}"
  - name: recommendations_count
    value: "{{steps.generate_recommendations.output.count}}"
  - name: avg_ranking
    value: "{{steps.track_rankings.output.average_position}}"

# 错误处理
on_error:
  - action: notify
    channel: feishu
    message: "SEO 优化工作流执行失败：{{error.message}}"
  - action: retry
    max_retries: 3
    delay: 300
