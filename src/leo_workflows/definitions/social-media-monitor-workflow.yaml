# 社交媒体监控工作流
# 多平台账号内容监控和竞品分析

name: social-media-monitor-workflow
description: 社交媒体自动监控工作流
version: 1.0.0
category: collaboration

# 触发条件
triggers:
  - type: cron
    expr: "0 9 * * *"  # 每天 9 点
  - type: manual
    description: 手动监控

# 输入参数
inputs:
  - name: platforms
    type: array
    default: ["x", "wechat_official", "wechat_channels", "douyin", "xiaohongshu"]
    description: 监控平台列表
  - name: generate_report
    type: boolean
    default: true
    description: 是否生成报告

# 执行步骤
steps:
  - name: load_accounts
    description: 加载账号配置
    agent: analysis_agent
    skill: social_media_monitor_skill
    action: list_accounts
    output: accounts

  - name: monitor_platforms
    description: 监控各平台
    agent: analysis_agent
    skill: social_media_monitor_skill
    action: monitor_all
    params:
      platforms: "{{inputs.platforms}}"
    output: monitor_results

  - name: analyze_competitors
    description: 竞品分析
    agent: analysis_agent
    skill: analytics-skill
    action: analyze_competitor_content
    params:
      monitor_results: "{{steps.monitor_platforms.output}}"
    output: competitor_analysis

  - name: generate_report
    description: 生成报告
    agent: creative_agent
    skill: doc-generator-skill
    action: generate_monitor_report
    params:
      monitor_results: "{{steps.monitor_platforms.output}}"
      competitor_analysis: "{{steps.analyze_competitors.output}}"
    output: report

  - name: notify_team
    description: 通知团队
    agent: distribution_agent
    skill: notification-skill
    action: send_notification
    params:
      message: "社交媒体监控报告已生成"
      report: "{{steps.generate_report.output}}"
    output: notification_result

# 输出
outputs:
  - name: report_file
    value: "{{steps.generate_report.output.file}}"
  - name: platforms_monitored
    value: "{{inputs.platforms}}"

# 错误处理
on_error:
  - action: notify
    channel: feishu
    message: "社交媒体监控工作流执行失败：{{error.message}}"
  - action: retry
    max_retries: 3
    delay: 300
