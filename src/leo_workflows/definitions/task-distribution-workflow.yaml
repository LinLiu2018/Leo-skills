# 任务分配工作流
# 多 Agent 任务分配和负载均衡

name: task-distribution-workflow
description: 任务自动分配工作流
version: 1.0.0
category: collaboration

# 触发条件
triggers:
  - type: event
    event: incoming_tasks  # 传入任务
  - type: manual
    description: 手动分配

# 输入参数
inputs:
  - name: tasks
    type: array
    required: true
    description: 任务列表
  - name: available_agents
    type: array
    description: 可用 Agent 列表
  - name: distribution_strategy
    type: string
    default: "round_robin"
    options: ["round_robin", "load_based", "skill_based", "priority"]
    description: 分配策略

# 执行步骤
steps:
  - name: analyze_tasks
    description: 分析任务
    agent: analysis_agent
    skill: analytics-skill
    action: analyze_tasks
    params:
      tasks: "{{inputs.tasks}}"
    output: task_analysis

  - name: check_agent_load
    description: 检查 Agent 负载
    agent: analysis_agent
    skill: analytics-skill
    action: check_agent_workload
    params:
      agents: "{{inputs.available_agents}}"
    output: agent_load

  - name: match_skills
    description: 匹配技能
    agent: analysis_agent
    skill: analytics-skill
    action: match_task_skills
    params:
      tasks: "{{inputs.tasks}}"
      agents: "{{inputs.available_agents}}"
    output: skill_matching

  - name: distribute_tasks
    description: 分配任务
    agent: task_agent
    skill: scheduler-skill
    action: distribute_tasks
    params:
      tasks: "{{inputs.tasks}}"
      agents: "{{inputs.available_agents}}"
      strategy: "{{inputs.distribution_strategy}}"
      load: "{{steps.check_agent_load.output}}"
      skills: "{{steps.match_skills.output}}"
    output: distribution_result

  - name: monitor_progress
    description: 监控进度
    agent: analysis_agent
    skill: analytics-skill
    action: monitor_task_progress
    params:
      distribution: "{{steps.distribute_tasks.output}}"
    output: progress_data

# 输出
outputs:
  - name: tasks_assigned
    value: "{{steps.distribute_tasks.output.assigned_count}}"
  - name: distribution_status
    value: "{{steps.distribute_tasks.output.status}}"

# 错误处理
on_error:
  - action: notify
    channel: feishu
    message: "任务分配工作流执行失败：{{error.message}}"
  - action: retry
    max_retries: 3
    delay: 300
