---
# 测试生成工作流
# ==============
# 自动化单元测试和集成测试生成

name: test-generation-pipeline
description: 自动化测试生成工作流 - 单元测试 + 集成测试 + E2E测试
version: "1.0"
continue_on_error: false

# 输入参数定义
inputs:
  code_path:
    type: string
    required: true
    description: 源代码路径
  test_type:
    type: string
    default: unit
    enum: [unit, integration, e2e, all]
  framework:
    type: string
    default: pytest
    description: 测试框架

# 工作流步骤
steps:
  - name: code_analysis
    type: sequential
    agent: architect_agent
    description: 分析代码结构

  - name: unit_tests
    type: sequential
    agent: unit_test_generator_skill
    description: 生成单元测试
    retries: 2

  - name: integration_tests
    type: conditional
    condition_key: test_type
    branches:
      "integration": generate_integration
      "e2e": generate_e2e
      "all": both_tests
    default: skip

  - name: generate_integration
    type: sequential
    agent: api_test_generator_skill
    description: 生成集成测试

  - name: generate_e2e
    type: sequential
    agent: e2e_test_generator_skill
    description: 生成E2E测试

  - name: both_tests
    type: parallel
    description: 同时生成集成测试和E2E测试
    parallel_steps:
      - name: integration_parallel
        agent: api_test_generator_skill
      - name: e2e_parallel
        agent: e2e_test_generator_skill

  - name: run_tests
    type: sequential
    agent: test_runner_skill
    description: 运行测试验证
    timeout: 300

# 输出定义
outputs:
  - name: test_files
    type: json
    description: 生成的测试文件列表
  - name: test_results
    type: json
    description: 测试运行结果
  - name: coverage_report
    type: string
    description: 覆盖率报告
